<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept 2 Preview · Radhika Seshan Homepage</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#23252A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  .bar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px 20px;background:#1C1E22;border-bottom:1px solid #34373E;
  }
  .bar h1{color:#fff;font-size:14px;font-weight:600}
  .bar span{color:#9AA0A8;font-size:12px}
  .frames{display:flex;align-items:flex-start;gap:20px;padding:20px;flex-wrap:wrap}
  .frame{flex:1 1 480px;min-width:340px}
  .frame h2{color:#9AA0A8;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
  .frame iframe{
    width:100%;height:92vh;min-height:640px;
    border:1px solid #34373E;border-radius:10px;background:#fff;
  }
  .frame.mobile{flex:0 0 390px}
  .frame.mobile iframe{width:390px;height:844px;min-height:0}
</style>
</head>
<body>
  <div class="bar">
    <h1>Radhika Seshan · Homepage Concept 2</h1>
    <span>radhikaseshan.com · iron gray + plum</span>
  </div>
  <div class="frames">
    <div class="frame">
      <h2>Desktop · Full page</h2>
      <iframe src="index.html" title="Desktop preview"></iframe>
    </div>
    <div class="frame mobile">
      <h2>Mobile · 390px</h2>
      <iframe src="index.html" title="Mobile preview"></iframe>
    </div>
  </div>
</body>
</html>
